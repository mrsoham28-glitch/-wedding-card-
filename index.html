<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>শুভ বিবাহ</title>
<link href="https://fonts.googleapis.com/css2?family=Galada&family=Noto+Serif+Bengali:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --maroon:#5a0f12; --deep:#260507; --gold:#c8921b; --gl:#f6dc8f; --ink:#5a1a14; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; background:var(--deep); }
  body { font-family:'Noto Serif Bengali',serif; color:var(--ink); text-align:center; }
  .hand { font-family:'Galada','Noto Serif Bengali',cursive; }
  .gold { background:linear-gradient(90deg,#a87512,#fbe7a1,#b8841a,#fbe7a1,#a87512); background-size:250% 100%;
          -webkit-background-clip:text; background-clip:text; color:transparent; animation:shine 5s linear infinite; }
  @keyframes shine { to { background-position:-250% 0; } }

  .stage { position:relative; height:100dvh; max-width:440px; margin:auto; overflow:hidden;
           background:radial-gradient(circle at 50% 30%,#7d1a1c,var(--deep) 75%); }
  .paper { position:absolute; inset:12px; background:linear-gradient(#fffaf0,#f6e9cc); border:1.5px solid var(--gold);
           box-shadow:0 0 40px rgba(0,0,0,.5); overflow:hidden; }
  .paper::after { content:""; position:absolute; inset:6px; border:1px solid rgba(200,146,27,.55); pointer-events:none; z-index:5; }
  .cn { position:absolute; width:46px; height:46px; z-index:6; stroke:var(--gold); fill:none; stroke-width:1.6; }
  .cn.tl { top:2px; left:2px; } .cn.tr { top:2px; right:2px; transform:scaleX(-1); }
  .cn.bl { bottom:2px; left:2px; transform:scaleY(-1); } .cn.br { bottom:2px; right:2px; transform:scale(-1); }

  .sc { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
        padding:44px 26px; gap:10px; opacity:0; transition:opacity 1.1s; pointer-events:none; }
  .sc.on { opacity:1; pointer-events:auto; }
  .a { opacity:0; }
  .on .a { animation:rise 1.3s cubic-bezier(.2,.7,.2,1) forwards; animation-delay:var(--d,0s); }
  @keyframes rise { from { opacity:0; filter:blur(8px); transform:translateY(16px); } to { opacity:1; filter:none; transform:none; } }
  @keyframes spin { to { transform:rotate(360deg); } }
  .mandala { position:absolute; width:480px; height:480px; top:50%; left:50%; margin:-240px 0 0 -240px; opacity:.16;
             animation:spin 70s linear infinite; }

  .sm { font-size:13px; letter-spacing:3px; color:var(--gold); }
  .t1 { font-size:46px; line-height:1.15; }
  .nm { font-size:32px; line-height:1.2; }
  .dt { font-size:17px; font-weight:600; color:var(--gold); }
  .arch { width:190px; height:238px; padding:4px; border-radius:95px 95px 6px 6px; margin:6px 0;
          background:linear-gradient(135deg,#a87512,#fbe7a1,#a87512); }
  .arch > * { width:100%; height:100%; border-radius:91px 91px 3px 3px; object-fit:cover; display:flex;
              align-items:center; justify-content:center; background:#7d1a1c; color:var(--gl); font-size:46px; }
  .dv { display:flex; align-items:center; gap:10px; width:70%; color:var(--gold); }
  .dv i { flex:1; height:1px; background:linear-gradient(90deg,transparent,var(--gold),transparent); }
  p { font-size:15.5px; line-height:1.9; }
  .card { width:100%; border:1px solid rgba(200,146,27,.6); border-radius:14px; padding:12px 14px; background:rgba(255,255,255,.5); }
  .card b { color:var(--maroon); }
  .row { display:flex; gap:10px; width:100%; } .row .card { flex:1; font-size:14px; line-height:1.7; }
  .h { font-size:24px; color:var(--maroon); }
  #cd { display:flex; gap:8px; justify-content:center; }
  #cd div { width:64px; padding:8px 0; border-radius:10px; color:var(--gl); background:linear-gradient(var(--maroon),#7d1a1c);
            border:1px solid var(--gold); } #cd b { display:block; font-size:24px; } #cd span { font-size:11px; }
  .btn { display:inline-block; margin:4px; background:linear-gradient(var(--maroon),#7d1a1c); color:var(--gl); padding:9px 22px;
         border-radius:24px; text-decoration:none; font:600 14px 'Noto Serif Bengali',serif; border:1px solid var(--gold); cursor:pointer; }

  /* শুরুর লাল খাম */
  #start { position:absolute; inset:0; z-index:60; cursor:pointer; display:flex; align-items:center; justify-content:center;
           background:radial-gradient(circle at 50% 40%,#7d1a1c,#2a0608 78%); }
  #start.open { pointer-events:none; } #start.fade { opacity:0; transition:opacity 1.3s; }
  .env { --w:min(82vw,330px); position:relative; width:var(--w); height:calc(var(--w)*.68); perspective:1100px;
         animation:flt 3.2s ease-in-out infinite alternate; }
  @keyframes flt { to { transform:translateY(-7px); } }
  #start.open .env { animation:none; }
  .eback { position:absolute; inset:0; background:#6e1316; border-radius:6px; box-shadow:0 26px 40px rgba(0,0,0,.55); }
  .efront { position:absolute; inset:0; z-index:3; border-radius:6px; background:linear-gradient(160deg,#d63a35,#a5201f 70%);
            clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%); }
  .efront::before { content:""; position:absolute; inset:0; background:linear-gradient(90deg,rgba(0,0,0,.18),transparent 50%,rgba(255,255,255,.12)); }
  .eflap { position:absolute; left:0; top:0; width:100%; height:56%; z-index:4; transform-origin:50% 0;
           background:linear-gradient(#e2453f,#b3262a); clip-path:polygon(0 0,100% 0,50% 100%); }
  @keyframes flapOpen { 0% { transform:rotateX(0); z-index:4; } 49% { z-index:4; } 50% { z-index:1; } 100% { transform:rotateX(180deg); z-index:1; } }
  #start.open .eflap { animation:flapOpen .9s .45s ease-in-out forwards; }
  .seal { position:absolute; left:50%; top:54%; width:50px; height:50px; margin:-25px 0 0 -25px; z-index:6; border-radius:50%;
          background:radial-gradient(circle at 35% 30%,#fff2b0,#d9a21e 60%,#9a6a0e); display:flex; align-items:center; justify-content:center;
          color:#7a1a12; font-size:24px; box-shadow:0 3px 8px rgba(0,0,0,.5); animation:pulse 1.6s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform:scale(1.1); } }
  #start.open .seal { animation:none; opacity:0; transform:scale(1.8); transition:all .45s; }
  .ecard { position:absolute; left:6%; top:5%; width:88%; height:94%; z-index:2; background:linear-gradient(#fffaf0,#f6e9cc);
           border:2px solid var(--gold); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
           text-align:center; color:var(--maroon); box-shadow:inset 0 0 0 5px #fffaf0,inset 0 0 0 6px rgba(200,146,27,.6);
           transition:transform 1.2s cubic-bezier(.3,.7,.2,1); }
  #start.open .ecard { transform:translateY(-64%); transition-delay:1.35s; }
  #start.zoom .ecard { z-index:20; transform:translateY(-50%) scale(1.4); transition:transform 1.5s ease-in-out; transition-delay:0s; }
  #start.zoom .eback, #start.zoom .efront, #start.zoom .eflap { opacity:0; transition:opacity 1s; }
  .eh { position:absolute; left:0; right:0; top:calc(100% + 34px); text-align:center; color:var(--gl); font-size:15px; letter-spacing:1px;
        animation:blink 1.6s ease-in-out infinite alternate; }
  @keyframes blink { from { opacity:.4; } to { opacity:1; } }
  #start.open .eh { opacity:0; animation:none; transition:opacity .3s; }
  canvas { position:absolute; inset:0; width:100%; height:100%; z-index:40; pointer-events:none; }

  /* ===== কভার দৃশ্য (পর্দা, মালা, লণ্ঠন, কলাপাতা) ===== */
  .cover { padding:0; display:block; overflow:hidden; z-index:20; background:radial-gradient(#fffefa,#f6ead2 72%); }
  .cover svg { position:absolute; left:0; width:100%; height:auto; display:block; }
  .cvTop { top:0; z-index:3; -webkit-mask-image:linear-gradient(#000 78%,transparent); mask-image:linear-gradient(#000 78%,transparent); } .cvBot { bottom:0; z-index:1; }
  .cover .e { opacity:0; }
  .cover.on .e { animation:var(--k) var(--t,1.5s) cubic-bezier(.2,.7,.2,1) var(--d,0s) forwards; }
  .cover .sw  { transform-box:fill-box; transform-origin:50% 0; }
  .cover .sw2 { transform-box:fill-box; transform-origin:0 100%; }
  .cover.on .sw  { animation:swing 3.4s ease-in-out var(--d2,3s) infinite alternate; }
  .cover.on .sw2 { animation:swing2 4.2s ease-in-out var(--d2,3s) infinite alternate; }
  .cover.on .fl  { animation:glow 1.8s ease-in-out infinite alternate; }
  @keyframes inL   { from { opacity:0; transform:translateX(-110%); } to { opacity:1; transform:none; } }
  @keyframes inR   { from { opacity:0; transform:translateX(110%); }  to { opacity:1; transform:none; } }
  @keyframes dropIn{ from { opacity:0; transform:translateY(-140px); } to { opacity:1; transform:none; } }
  @keyframes riseIn{ from { opacity:0; transform:translateY(140px); }  to { opacity:1; transform:none; } }
  @keyframes fadeIn{ from { opacity:0; transform:scale(.94); } to { opacity:1; transform:none; } }
  @keyframes wipe  { from { opacity:1; clip-path:inset(-15% 100% -15% -5%); } to { opacity:1; clip-path:inset(-15% -8% -15% -5%); } }
  @keyframes swing { from { transform:rotate(-4deg); } to { transform:rotate(4deg); } }
  @keyframes swing2{ from { transform:rotate(-3.6deg); } to { transform:rotate(3.6deg); } }
  @keyframes zoomIn{ from { opacity:0; transform:scale(1.12); } to { opacity:1; transform:none; } }
  @keyframes glow  { from { opacity:.75; } to { opacity:1; } }
  @keyframes fall  { 0% { opacity:0; transform:translate(0,-20px) rotate(0); } 10% { opacity:.9; }
                     100% { opacity:0; transform:translate(var(--x),108vh) rotate(560deg); } }
  .cvTitle { position:absolute; top:21%; left:0; right:0; z-index:4; color:#c4560f; font-size:50px; line-height:1.02;
             text-shadow:0 0 14px #fff8e8,0 2px 0 rgba(255,255,255,.6); }
  .cvTitle span { display:block; width:fit-content; margin:0 auto; }
  .cvNm { position:absolute; top:calc(21% + 168px); left:0; right:0; z-index:4; font-size:36px; line-height:1.2; filter:drop-shadow(0 0 5px rgba(255,255,255,.95)); }
  .cvNm span { background-size:250% 100%; -webkit-background-clip:text; background-clip:text; color:transparent; animation:shine 5s linear infinite; }
  .cvNm .g1 { background-image:linear-gradient(90deg,#c62828,#ff6f00,#f9a825,#ff6f00,#c62828); }
  .cvNm .g2 { background-image:linear-gradient(90deg,#ad1457,#e91e63,#ff7043,#e91e63,#ad1457); }
  .cvNm .g0 { background:none; color:#c8921b; -webkit-text-fill-color:#c8921b; animation:none; font-size:.7em; }
  .cvDt { position:absolute; top:calc(21% + 232px); left:0; right:0; z-index:4; font-size:15px; font-weight:600; color:#b7791a; letter-spacing:.5px; }
  .cvPh { position:absolute; bottom:0; left:50%; margin-left:-125px; width:250px; height:310px; z-index:2; padding:4px 4px 0;
          border-radius:125px 125px 0 0; background:linear-gradient(135deg,#a87512,#fbe7a1,#a87512); }
  .cvPh > * { width:100%; height:100%; border-radius:121px 121px 0 0; object-fit:cover; display:flex; align-items:center;
              justify-content:center; background:linear-gradient(#fdeee6,#f2c7bd); color:var(--maroon); font-size:54px; }
  .pt { position:absolute; top:-20px; width:10px; height:14px; border-radius:50% 0 50% 0; opacity:0; z-index:5; }
  .cover.on .pt { animation:fall var(--t) linear var(--dl) infinite; }

  .cvMd { --s:min(224px,26vh); position:absolute; bottom:9%; left:50%; width:var(--s); height:var(--s); margin-left:calc(var(--s) / -2); z-index:2; filter:drop-shadow(0 8px 14px rgba(170,40,80,.35)); }
  .mdl { position:absolute; inset:0; width:100%; height:100%; stroke:none; animation:spin 38s linear infinite; }
  .cvMt { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; font-size:calc(var(--s) * .12); line-height:1.08; color:#b3261e; text-shadow:0 0 6px #fff8e6; }
  @keyframes bloomIn { from { opacity:0; transform:scale(.15) rotate(-140deg); } to { opacity:1; transform:none; } }
  .cpImg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:50% 100%; }
  .cpNm { position:absolute; top:19%; left:0; right:0; z-index:4; color:#c4161c; font-size:min(44px,5.2vh); line-height:1.1;
          text-shadow:0 0 12px #fff,0 0 4px #fff,0 2px 5px rgba(120,0,0,.25); }
  .cpNm span { display:block; width:fit-content; margin:0 auto; } .cpNm .sm2 { font-size:.55em; }
  .cpDt { position:absolute; top:calc(19% + min(124px,15.5vh)); left:0; right:0; z-index:4; color:#b3261e; font-weight:600; font-size:15px;
          text-shadow:0 0 8px #fff,0 0 3px #fff; }

  /* ===== দ্বিতীয় দৃশ্য: নাম লেখা দম্পতির ছবি ===== */
  .cpImg { opacity:0; object-position:50% 30%; }
  .cover.on .cpImg { animation:bloom 2.4s cubic-bezier(.2,.7,.2,1) forwards, drift 14s ease-in-out 2.4s infinite alternate; }
  @keyframes bloom { from { opacity:1; clip-path:circle(0% at 50% 38%); transform:scale(1.14); }
                     to   { opacity:1; clip-path:circle(100% at 50% 38%); transform:scale(1); } }
  @keyframes drift { from { transform:scale(1); } to { transform:scale(1.06) translateY(-1.2%); } }
  .cpShine { position:absolute; left:0; right:0; top:14%; height:27%; z-index:3; overflow:hidden; pointer-events:none;
             -webkit-mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent); mask-image:linear-gradient(transparent,#000 22%,#000 78%,transparent); }
  .cpShine::after { content:""; position:absolute; top:0; bottom:0; width:40%; left:-60%; opacity:0; mix-blend-mode:soft-light;
                    background:linear-gradient(105deg,transparent,#fff,transparent); }
  .cover.on .cpShine::after { animation:sweep 4.6s ease-in-out 3.2s infinite; }
  @keyframes sweep { 0% { left:-60%; opacity:0; } 12% { opacity:1; } 55% { left:115%; opacity:1; } 60% { opacity:0; } 100% { left:115%; opacity:0; } }
  .stx { position:absolute; z-index:4; color:#fff3b0; font-style:normal; font-size:16px; opacity:0; pointer-events:none;
         text-shadow:0 0 8px #ffd34d,0 0 14px #ffb300; }
  .cover.on .stx { animation:twk 2.4s ease-in-out var(--dl) infinite; }
  @keyframes twk { 0%,100% { opacity:0; transform:scale(.3) rotate(0); } 50% { opacity:1; transform:scale(1.3) rotate(45deg); } }

  /* ===== তথ্যের পাতা (পরিচিতি / নিমন্ত্রণ / অনুষ্ঠান) ===== */
  @keyframes wipeY { from { opacity:1; clip-path:inset(0 0 100% 0); } to { opacity:1; clip-path:inset(0 0 -8% 0); } }
  @keyframes popIn { from { opacity:0; transform:scale(.4); } 60% { transform:scale(1.14); } to { opacity:1; transform:none; } }
  @keyframes bob { from { transform:translateY(0); } to { transform:translateY(-4px) rotate(.6deg); } }
  .cover.pg { display:flex; flex-direction:column; justify-content:center; align-items:center; padding:110px 14px 130px; color:#b3141c;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/><feColorMatrix values='0 0 0 0 .55 0 0 0 0 .45 0 0 0 0 .2 0 0 0 .13 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>"),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='72' height='72'><g fill='none' stroke='%23b8841a' stroke-opacity='.17' stroke-width='.9'><path d='M36 8L64 36L36 64L8 36Z'/><circle cx='36' cy='36' r='9'/><path d='M36 18Q43 30 36 36Q29 30 36 18ZM36 54Q43 42 36 36Q29 42 36 54ZM18 36Q30 29 36 36Q30 43 18 36ZM54 36Q42 29 36 36Q42 43 54 36Z'/></g></svg>"),
    radial-gradient(ellipse at 50% 18%,#fffdf2 0%,#faedc8 36%,#eed9a2 76%,#e0c07a 100%); box-shadow:inset 0 0 150px rgba(150,95,20,.34); }
  .col2 { width:100%; max-width:340px; }
  .ln { display:block; width:fit-content; max-width:100%; text-align:left; font-family:'Galada','Noto Serif Bengali',cursive;
        font-size:calc(var(--u,1) * clamp(14px,2.5vh,21px)); line-height:1.55; }
  .ln.c { margin:0 auto; } .ln.hd { margin-top:6px; font-size:calc(var(--u,1) * clamp(17px,2.8vh,23px)); color:#8f0f16; }
  .sp { height:clamp(6px,1.6vh,14px); }
  .pg .tag { display:block; width:fit-content; margin:6px auto 8px; background:#ffe600; color:#b3141c; padding:2px 28px;
             border-radius:18px; font:400 clamp(19px,3vh,24px) 'Galada',cursive; }
  .para { font-family:'Galada','Noto Serif Bengali',cursive; font-size:calc(var(--u,1) * clamp(13px,2.15vh,18px)); line-height:1.7; text-align:left; margin:6px 0; }
  .pgTop { top:0; z-index:3; } .pgBot { bottom:22px; z-index:1; }
  .pgStrip { position:absolute; left:0; right:0; bottom:0; height:22px; z-index:2; border-top:2px solid #b07a1e;
    background:repeating-linear-gradient(45deg,#c8921b 0 2px,transparent 2px 9px),repeating-linear-gradient(-45deg,#c8921b 0 2px,transparent 2px 9px),#efe0b0; }
  .ele { position:absolute !important; left:-6px; bottom:26px; width:min(260px,62vw) !important; z-index:2; }
  .bob { animation:bob 2.2s ease-in-out infinite alternate; }

  /* ===== গুছিয়ে সাজানো: প্যানেল, নকশা, আরও অ্যানিমেশন ===== */
  @keyframes unfold { from { opacity:0; transform:scale(.9) translateY(18px); } to { opacity:1; transform:none; } }
  @keyframes growX  { from { opacity:0; transform:scaleX(.05); } to { opacity:1; transform:none; } }
  @keyframes sw3    { from { transform:rotate(-.7deg); } to { transform:rotate(.7deg); } }
  .sc.cover { transform:scale(1.03); transition:opacity 1.1s, transform 1.8s ease; }
  .sc.cover.on { transform:none; }
  .cover .sw3 { transform-box:fill-box; transform-origin:50% 0; }
  .cover.on .sw3 { animation:sw3 5s ease-in-out 1.5s infinite alternate; }
  .panel { position:relative; width:100%; max-width:344px; padding:16px 14px 12px; border:1.5px solid rgba(200,146,27,.85); border-radius:18px;
           background:linear-gradient(rgba(255,251,238,.66),rgba(255,246,222,.5)); box-shadow:0 8px 26px rgba(120,60,10,.14),inset 0 0 0 4px rgba(255,250,235,.6),inset 0 0 0 5px rgba(200,146,27,.45); }
  .panel::before,.panel::after { content:"❖"; position:absolute; left:50%; margin-left:-11px; font-size:15px; line-height:1; color:#c8921b; background:#f1e4bd; padding:0 4px; }
  .panel::before { top:-9px; } .panel::after { bottom:-9px; }
  .sp2 { height:calc(var(--u,1) * 16px); }
  .orn { display:flex; align-items:center; gap:8px; width:72%; margin:5px auto; color:#c8921b; font-size:12px; }
  .orn i { flex:1; height:1px; background:linear-gradient(90deg,transparent,#c8921b,transparent); }

  /* ===== প্রিমিয়াম ব্যাকগ্রাউন্ড ===== */
  .cover.pg::after { content:""; position:absolute; inset:8px; z-index:0; pointer-events:none; border:1.5px solid rgba(190,135,25,.75); border-radius:8px;
    box-shadow:inset 0 0 0 4px rgba(255,248,225,.55),inset 0 0 0 5px rgba(190,135,25,.35); }
  .pgRays { position:absolute; left:50%; top:-8%; width:190%; height:92%; margin-left:-95%; transform-origin:50% 0; pointer-events:none;
    background:conic-gradient(from 150deg at 50% 0,transparent 0deg,rgba(255,232,150,.34) 11deg,transparent 22deg,rgba(255,232,150,.24) 34deg,transparent 46deg,rgba(255,232,150,.32) 58deg,transparent 70deg,rgba(255,232,150,.24) 82deg,transparent 94deg,rgba(255,232,150,.34) 106deg,transparent 120deg);
    -webkit-mask-image:linear-gradient(#000,transparent 82%); mask-image:linear-gradient(#000,transparent 82%); opacity:0; }
  .cover.on .pgRays { animation:rays 7s ease-in-out infinite alternate; }
  @keyframes rays { from { opacity:.45; transform:rotate(-3deg); } to { opacity:1; transform:rotate(3deg); } }
  .pgMd { position:absolute; width:540px; height:540px; left:50%; top:50%; margin:-270px 0 0 -270px; opacity:.2; pointer-events:none; animation:spin 140s linear infinite; }
  .bk { position:absolute; bottom:-40px; width:var(--s); height:var(--s); border-radius:50%; opacity:0; pointer-events:none; filter:blur(1.2px);
        background:radial-gradient(circle,rgba(255,238,175,.95),rgba(255,206,90,.28) 58%,transparent 70%); }
  .cover.on .bk { animation:bkUp var(--t) ease-in-out var(--dl) infinite; }
  @keyframes bkUp { 0% { opacity:0; transform:translateY(0) scale(.6); } 22% { opacity:.85; } 100% { opacity:0; transform:translateY(-72vh) scale(1.25); } }
  .cover .diya { position:absolute; bottom:34px; width:30px; height:34px; margin-left:-15px; z-index:2; overflow:visible; }
  .fl2 { transform-box:fill-box; transform-origin:50% 100%; animation:flick 1.1s ease-in-out var(--fd,0s) infinite alternate; }
  .gl2 { animation:glow 1.5s ease-in-out var(--fd,0s) infinite alternate; }

const G = [...Array(26)].map(() => ({ x:R(), y:R(), r:R()*2 + .6, v:R()*.0005 + .0002, p:R()*6 }));
(function loop(t) {

      cx.fillStyle = '#ffe27a'; cx.beginPath(); cx.arc(0, 0, r*.28, 0, 6.3); cx.fill(); }
    cx.restore(); });
